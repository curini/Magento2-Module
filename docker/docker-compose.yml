services:
  nginx:
    image: nginx:1.25
    container_name: magento-nginx
    ports:
      - "80:80"
    volumes:
      - ../../../../../:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: ./php
    container_name: magento-php
    volumes:
      - ../../../../../:/var/www/html
    environment:
      - PHP_MEMORY_LIMIT=2G
      - PHP_MAX_EXECUTION_TIME=1800
    depends_on:
      - db
      - elasticsearch
      - redis

  db:
    image: mariadb:10.6
    container_name: magento-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:7
    container_name: magento-redis

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: magento-es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  mailhog:
    image: mailhog/mailhog
    container_name: magento-mailhog
    ports:
      - "8025:8025"

  cron:
    build: ./php
    container_name: magento-cron
    command:
      [
        "bash",
        "-c",
        "while true; do php /var/www/html/bin/magento cron:run; sleep 60; done",
      ]
    volumes:
      - ../../../../../:/var/www/html
    depends_on:
      - php

volumes:
  dbdata:
  esdata:
