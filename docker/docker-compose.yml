services:
  nginx:
    image: nginx:1.25
    container_name: magento-nginx
    ports:
      - "80:80"
    volumes:
      - magento_data:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: ./php
    container_name: magento-php
    volumes:
      - magento_data:/var/www/html
      - ../../..:/var/www/html/app/code
    environment:
      - PHP_MEMORY_LIMIT=2G
      - PHP_MAX_EXECUTION_TIME=1800
    depends_on:
      - db
      - opensearch
      - redis

  db:
    image: mariadb:10.6
    container_name: magento-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:7
    container_name: magento-redis

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: magento-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data

  mailhog:
    image: mailhog/mailhog
    container_name: magento-mailhog
    ports:
      - "8025:8025"

  cron:
    build: ./php
    container_name: magento-cron
    command:
      [
        "bash",
        "-c",
        "while true; do php /var/www/html/bin/magento cron:run; sleep 60; done",
      ]
    volumes:
      - magento_data:/var/www/html
      - ../../..:/var/www/html/app/code
    depends_on:
      - php

volumes:
  dbdata:
  osdata:
  magento_data:
